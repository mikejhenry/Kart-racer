# On every push to main:
#   1. Deploys the game server (server/) to Cloudflare, if the Cloudflare
#      secrets are set. Without them the game builds with online play off.
#   2. Builds the Web version with Godot, pointed at that server.
#   3. Publishes it to GitHub Pages.
#
# One-time setup:
#   - Settings > Pages > Source: "GitHub Actions"
#   - Settings > Secrets and variables > Actions: add CLOUDFLARE_API_TOKEN and
#     CLOUDFLARE_ACCOUNT_ID (see README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  server:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare keys
        id: keys
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set, so online play stays off. See README."
          fi

      - name: Deploy game server to Cloudflare
        id: deploy
        if: steps.keys.outputs.present == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server

      - name: Find server URL
        id: url
        if: steps.keys.outputs.present == 'yes'
        env:
          OUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          url="$DEPLOY_URL"
          if [ -z "$url" ]; then
            url=$(printf '%s' "$OUT" | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1)
          fi
          if [ -z "$url" ]; then
            echo "::warning::Deployed, but couldn't find the server URL in the output."
          fi
          echo "Server URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  build:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the game at the server
        if: needs.server.outputs.url != ''
        env:
          SERVER_URL: ${{ needs.server.outputs.url }}
        run: |
          printf 'extends RefCounted\n## Written by the deploy workflow.\nconst URL := "%s"\n' "$SERVER_URL" > scripts/server_config.gd
          cat scripts/server_config.gd

      - name: Install Godot and web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/web_*' 'templates/version.txt' -d "$dest"

      - name: Export for Web
        run: |
          mkdir -p build/web
          ./godot --headless --import || true
          ./godot --headless --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
